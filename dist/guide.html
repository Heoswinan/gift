<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EEE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="罐罐旅游指南">
<meta name="format-detection" content="telephone=no">
<title>罐罐旅游指南 · 全国美食与景点地图</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='40' rx='10' fill='%23E2572B'/%3E%3Cpath d='M20 34c6-8 18-8 24 0-6 8-18 8-24 0z' fill='%23FFFDF8'/%3E%3Crect x='16' y='24' width='32' height='6' rx='3' fill='%23FFFDF8'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./vendor/leaflet.css">
<style>
  :root{
    --paper:#F3EEE3;
    --paper-deep:#E9E0CE;
    --ink:#26211A;
    --ink-2:#51483C;
    --muted:#8C8170;
    --line:#DFD5C0;
    --card:#FFFDF8;
    --food:#9c1b31;
    --food-deep:#6a1323;
    --food-soft:#FBE4DA;
    --scene:#ebcb2e;
    --scene-deep:#f2ca04;
    --scene-soft:#fef3c3;
    --star:#F2A53C;
    --shadow:0 10px 28px rgba(64,48,22,.14);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}

  /* ===== 顶部栏 ===== */
  #topbar{
    height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;
    padding-top:env(safe-area-inset-top);
    height:calc(56px + env(safe-area-inset-top));
    background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:1200;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-logo{
    width:34px;height:34px;border-radius:9px;background:var(--food);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:700;flex:0 0 auto;
  }
  .brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .brand-name{font-size:16px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
  .brand-sub{font-size:11px;color:var(--muted);white-space:nowrap}
  .seg{
    display:flex;background:var(--paper-deep);border-radius:999px;padding:3px;gap:2px;flex:0 1 auto;min-width:0;
    margin-left:auto;margin-right:4px;
  }
  .seg button{
    border:0;background:transparent;padding:5px 10px;border-radius:999px;
    font-size:12px;font-weight:600;color:var(--ink-2);transition:.2s;white-space:nowrap;flex:0 1 auto;
  }
  .seg button .cnt{font-size:10px;opacity:.65;margin-left:2px}
  .seg button.on-food{background:var(--food);color:#fff;box-shadow:var(--shadow)}
  .seg button.on-scene{background:var(--scene);color:#fff;box-shadow:var(--shadow)}
  .btn-ghost{
    border:1px solid var(--line);background:var(--card);color:var(--ink-2);
    padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;flex:0 0 auto;transition:.15s;
  }
  .btn-ghost:hover{border-color:var(--food);color:var(--food)}
  .btn-ghost .plus{font-weight:800;margin-right:4px}
  #serviceStatus{font-size:11px;color:var(--muted);max-width:190px;text-align:right;display:flex;align-items:center;gap:5px;justify-content:flex-end}
  #serviceStatus::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  #serviceStatus.connected{color:#27734e}
  #serviceStatus.connected::before{background:#2f9e63;box-shadow:0 0 0 3px rgba(47,158,99,.16)}
  #serviceStatus .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ===== 主布局 ===== */
  #app{display:flex;flex-direction:column;height:calc(100% - 56px - env(safe-area-inset-top))}
  #listPanel{
    height:45vh;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  #mapPanel{height:55vh;position:relative;min-height:0}
  #map{width:100%;height:100%;background:#EAF0E6}
  .legend{
    position:absolute;left:12px;bottom:16px;z-index:500;background:rgba(255,253,248,.92);
    border:1px solid var(--line);border-radius:10px;padding:8px 11px;display:flex;gap:14px;
    font-size:12px;color:var(--ink-2);backdrop-filter:blur(2px);
  }
  .lg-item{display:flex;align-items:center;gap:6px}
  .lg-dot{width:12px;height:12px;border-radius:4px}
  .lg-dot.food{background:var(--food)}
  .lg-dot.scene{background:var(--scene)}
  .map-fab{
    position:absolute;right:12px;bottom:16px;z-index:500;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow);
  }
  .map-hint{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:500;
    background:rgba(38,33,26,.82);color:#fff;font-size:12px;padding:7px 13px;border-radius:999px;
    pointer-events:none;transition:opacity .3s;opacity:0;white-space:nowrap;
  }
  .map-hint.show{opacity:1}

  /* ===== 列表 ===== */
  #listHead{
    padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  #listHead .t{font-size:13px;font-weight:800;color:var(--ink-2)}
  #listHead .t .k{color:var(--muted);font-weight:600}
  #cityList{flex:1;overflow-y:auto;padding:6px 0 16px;-webkit-overflow-scrolling:touch}
  .city{border-bottom:1px solid var(--line)}
  .city-head{
    display:flex;align-items:center;gap:9px;padding:10px 16px;cursor:pointer;user-select:none;
    position:sticky;top:0;background:var(--card);z-index:2;
  }
  .city-head:hover{background:#FBF7EE}
  .city-head .name{font-size:14px;font-weight:800;flex:1}
  .city-head .n{
    font-size:11px;background:var(--paper-deep);color:var(--ink-2);border-radius:999px;padding:2px 8px;font-weight:600;
  }
  .city-head .chev{color:var(--muted);font-size:10px;transition:transform .2s;display:inline-block}
  .city.open .chev{transform:rotate(90deg)}
  .city-items{display:none;padding:0 8px 6px}
  .city.open .city-items{display:block}
  .poi-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:.15s;
  }
  .poi-item:hover{background:#F7F2E6}
  .poi-item.active{background:var(--food-soft)}
  .poi-item.active.scene{background:var(--scene-soft)}
  .type-badge{
    font-size:11px;font-weight:700;border-radius:7px;padding:3px 8px;flex:0 0 auto;
  }
  .type-badge.food{background:var(--food-soft);color:var(--food-deep)}
  .type-badge.scene{background:var(--scene-soft);color:var(--scene-deep)}
  .poi-body{flex:1;min-width:0}
  .poi-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poi-desc{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .poi-score{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;min-width:40px}
  .poi-score .s{color:var(--star);font-weight:800;font-size:14px}
  .poi-score .st{font-size:10px;color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 16px}

  /* ===== 弹窗通用 ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(38,33,26,.42);z-index:2000;display:none;
    align-items:flex-end;justify-content:center;
  }
  .overlay.show{display:flex}
  @media(min-width:768px){.overlay{align-items:center}}
  .sheet{
    background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:88vh;
    overflow-y:auto;box-shadow:var(--shadow);animation:up .25s cubic-bezier(.22,1,.36,1);
  }
  @media(min-width:768px){.sheet{border-radius:20px}}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .sheet-head{
    display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--card);z-index:5;
  }
  .sheet-head .tt{font-size:16px;font-weight:800;flex:1;display:flex;align-items:center;gap:9px;min-width:0}
  .sheet-close{
    border:0;background:var(--paper-deep);width:32px;height:32px;border-radius:50%;
    font-size:16px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .sheet-close:hover{background:#ddd2ba}
  .sheet-body{padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}

  /* ===== 详情 ===== */
  .det-top{display:flex;gap:14px;align-items:flex-start}
  .det-badge{font-size:12px;font-weight:700;border-radius:8px;padding:4px 10px;flex:0 0 auto}
  .det-badge.food{background:var(--food-soft);color:var(--food-deep)}
  .det-badge.scene{background:var(--scene-soft);color:var(--scene-deep)}
  .det-name{font-size:21px;font-weight:800;margin:8px 0 2px}
  .det-city{font-size:13px;color:var(--muted)}
  .det-score{display:flex;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}
  .det-num{font-size:40px;font-weight:800;color:var(--star);line-height:1}
  .det-stars{font-size:20px;letter-spacing:2px}
  .det-reviews{font-size:13px;color:var(--muted)}
  .det-desc{font-size:14px;color:var(--ink-2);background:var(--paper);border-radius:12px;padding:12px 14px;line-height:1.7}
  .det-video{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:13px;font-weight:600;
    color:#fff;background:#9b1c31;padding:8px 13px;border-radius:9px;text-decoration:none}
  .det-video:hover{filter:brightness(.95)}
  .det-dim{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
  .dim-chip{background:var(--paper-deep);border-radius:9px;padding:7px 12px;font-size:12px;color:var(--ink-2)}
  .dim-chip b{color:var(--ink);font-size:14px;margin-left:5px}

  .h-sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
  .h-sec h3{font-size:15px;font-weight:800}
  .dist{display:flex;align-items:center;gap:8px;margin:8px 0 4px;font-size:12px;color:var(--ink-2)}
  .dist .lbl{flex:0 0 44px;color:var(--muted)}
  .dist .bar{flex:1;height:9px;background:var(--paper-deep);border-radius:99px;overflow:hidden}
  .dist .fill{height:100%;border-radius:99px;background:var(--star)}
  .dist .pct{flex:0 0 38px;text-align:right;color:var(--muted)}
  .filter-row{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .filter-row button{
    border:1px solid var(--line);background:var(--card);font-size:12px;padding:5px 11px;border-radius:999px;color:var(--ink-2);font-weight:600;
  }
  .filter-row button.on{border-color:var(--food);color:var(--food);background:var(--food-soft)}
  .filter-row button.on.scene{border-color:var(--scene);color:var(--scene-deep);background:var(--scene-soft)}

  .rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .rv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rv-author{font-size:13px;font-weight:700}
  .rv-anon{font-size:11px;color:var(--muted);font-weight:600}
  .rv-stars{font-size:14px;color:var(--star);letter-spacing:1px}
  .rv-time{font-size:11px;color:var(--muted);margin-left:auto}
  .rv-dims{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:5px}
  .rv-content{font-size:13.5px;color:var(--ink-2);margin:8px 0 0;line-height:1.65}
  .rv-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .rv-tags span{font-size:11px;background:var(--food-soft);color:var(--food-deep);border-radius:6px;padding:2px 8px}
  .rv-tags span.scene{background:var(--scene-soft);color:var(--scene-deep)}
  .rv-foot{display:flex;align-items:center;margin-top:9px}
  .rv-useful{
    border:1px solid var(--line);background:var(--card);font-size:12px;padding:4px 10px;border-radius:999px;
    color:var(--ink-2);font-weight:600;transition:.15s;
  }
  .rv-useful.on{background:var(--star);border-color:var(--star);color:#fff}
  .rv-reply{margin-left:auto;border:0;font-size:11px;color:var(--scene-deep);background:var(--scene-soft);border-radius:7px;padding:5px 10px;font-weight:700}
  .rv-reply:hover{filter:brightness(.96)}
  .rv-replies{margin:10px 0 0 8px;padding-left:12px;border-left:2px solid var(--line)}
  .rv-reply-item{padding:7px 0}
  .rv-reply-item+.rv-reply-item{border-top:1px solid var(--line)}
  .rv-reply-top{display:flex;align-items:center;gap:8px;font-size:12px}
  .rv-reply-author{font-weight:700;color:var(--ink-2)}
  .rv-reply-time{margin-left:auto;color:var(--muted);font-size:10px}
  .rv-reply-content{margin-top:3px;font-size:12.5px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
  .rv-reply-form{margin:10px 0 0 8px;padding:10px;background:var(--paper);border-radius:10px}
  .rv-reply-form textarea{min-height:68px;background:var(--card)}
  .rv-reply-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:7px}
  .rv-reply-actions button{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--card);color:var(--ink-2);font-size:12px;font-weight:600}
  .rv-reply-actions button.submit{border-color:var(--food);background:var(--food);color:#fff}
  .rv-old{margin-top:12px;text-align:center;font-size:12px;color:var(--muted)}
  .rv-old button{border:0;background:none;color:var(--scene);font-weight:700;font-size:12px;text-decoration:underline}

  .btn-main{
    border:0;background:var(--food);color:#fff;font-size:14px;font-weight:700;padding:11px 20px;border-radius:11px;
    width:100%;transition:.15s;
  }
  .btn-main.scene{background:var(--scene)}
  .btn-main:hover{filter:brightness(1.05)}
  .btn-main:disabled{opacity:.5;cursor:not-allowed}

  /* ===== 点评表单 ===== */
  .f-label{font-size:13px;font-weight:700;color:var(--ink-2);margin:16px 0 8px}
  .stars-input{display:flex;gap:4px}
  .stars-input .st{font-size:30px;color:#E2D9C4;cursor:pointer;transition:.1s;line-height:1}
  .stars-input .st.on{color:var(--star)}
  .dims-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .dim-box{border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}
  .dim-box .lb{font-size:12px;color:var(--muted);margin-bottom:4px}
  .dim-box .st{font-size:20px;color:#E2D9C4;cursor:pointer}
  .dim-box .st.on{color:var(--star)}
  .f-field{margin-top:14px}
  .f-field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
  .f-field .req{color:var(--food)}
  textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;
    resize:vertical;min-height:88px;background:var(--card);color:var(--ink);
  }
  .f-count{font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
  .tags-row{display:flex;flex-wrap:wrap;gap:8px}
  .tag-chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-2);font-weight:600;transition:.15s}
  .tag-chip.on{background:var(--food-soft);border-color:var(--food);color:var(--food-deep)}
  .tag-chip.on.scene{background:var(--scene-soft);border-color:var(--scene);color:var(--scene-deep)}
  .img-row{display:flex;flex-wrap:wrap;gap:8px}
  .img-thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}
  .img-add{width:64px;height:64px;border-radius:9px;border:1px dashed var(--line);background:var(--paper);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
  .anon-row{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;color:var(--ink-2)}
  .anon-row input{width:18px;height:18px;accent-color:var(--food)}

  /* ===== UGC 表单 ===== */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  input[type=text],input[type=number],select{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--card);color:var(--ink);
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--food);outline-offset:0;border-color:transparent}
  .f-hint{font-size:11px;color:var(--muted);margin-top:5px}
  .pick-map{font-size:12px;font-weight:600;color:var(--scene);background:var(--scene-soft);border:0;border-radius:8px;padding:6px 10px;margin-top:6px}

  /* ===== toast ===== */
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:3000;
    background:rgba(38,33,26,.92);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:11px;
    opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 响应式 ===== */
  @media(min-width:768px){
    #topbar{padding:0 20px}
    #app{flex-direction:row}
    #listPanel{width:336px;height:100%;border-bottom:0;border-right:1px solid var(--line);flex:0 0 auto}
    #mapPanel{flex:1;height:100%}
    .sheet{max-height:92vh}
    .brand-sub{font-size:12px}
  }
  @media(max-width:520px){
    .grid-2,.grid-3{grid-template-columns:1fr}
    .brand-sub{display:none}
    #topbar{gap:6px;padding:0 10px}
    .brand{gap:7px}
    .brand-logo{width:30px;height:30px;font-size:16px}
    .brand-name{font-size:14px;letter-spacing:0}
    .seg{margin-right:0;padding:2px;gap:1px}
    .seg button{padding:4px 7px;font-size:11px}
    .seg button .cnt{font-size:9px;margin-left:1px}
    .btn-ghost{padding:6px 8px;font-size:11px}
    #serviceStatus .txt{display:none}
    #serviceStatus{max-width:none;flex:0 0 auto}
  }
  @media(max-width:380px){
    #topbar{gap:4px;padding:0 7px}
    .brand-logo{display:none}
    .brand-name{font-size:13px}
    .seg button{padding:4px 5px;font-size:10px}
    .btn-ghost{padding:5px 6px;font-size:10px}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  .leaflet-container{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:auto}
  .leaflet-container.leaflet-touch-zoom{cursor:grab}
  .leaflet-container.leaflet-touch-drag{cursor:grab}
  .poi-pin{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border-radius:99px;color:#fff;
    font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.28);border:2px solid #fff}
  .poi-pin .ig{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:9px;flex:0 0 auto}
  .poi-pin .pin-name{display:inline}
  #map.labels-hidden .poi-pin{padding:3px;border-radius:50%}
  #map.labels-hidden .poi-pin .pin-name{display:none}
  .poi-pin.food{background:var(--food)}
  .poi-pin.scene{background:var(--scene)}
  .poi-div{background:transparent;border:0}
  .dims-input{display:flex;gap:2px;justify-content:center}
  .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--shadow)}
  .leaflet-popup-content{margin:14px 16px;line-height:1.5}
  .pop-title{font-size:15px;font-weight:800;margin-bottom:2px}
  .pop-row{font-size:12.5px;color:var(--ink-2)}

/* ===================== 坐标转换（WGS-84 → GCJ-02）=====================
   底图使用腾讯位置服务，坐标系为 GCJ-02。内置示例点位按 WGS-84 书写，
   统一转换后再落点，避免系统性偏移。地图选点得到的坐标本身已是 GCJ-02。 */
const GCJ_A = 6378245.0;
const GCJ_EE = 0.00669342162296594323;
function outOfChina(lng, lat){ return !(lng > 72.004 && lng < 137.8347 && lat > 0.8293 && lat < 55.8271); }
function transformLat(x, y){
  let ret = -100.0 + 2.0*x + 3.0*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  ret += (20.0*Math.sin(6.0*x*Math.PI) + 20.0*Math.sin(2.0*x*Math.PI))*2.0/3.0;
  ret += (20.0*Math.sin(y*Math.PI) + 40.0*Math.sin(y/3.0*Math.PI))*2.0/3.0;
  ret += (160.0*Math.sin(y/12.0*Math.PI) + 320*Math.sin(y*Math.PI/30.0))*2.0/3.0;
  return ret;
}
function transformLng(x, y){
  let ret = 300.0 + x + 2.0*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  ret += (20.0*Math.sin(6.0*x*Math.PI) + 20.0*Math.sin(2.0*x*Math.PI))*2.0/3.0;
  ret += (20.0*Math.sin(x*Math.PI) + 40.0*Math.sin(x/3.0*Math.PI))*2.0/3.0;
  ret += (150.0*Math.sin(x/12.0*Math.PI) + 300.0*Math.sin(x/30.0*Math.PI))*2.0/3.0;
  return ret;
}
function wgs84ToGcj02(lng, lat){
  if(outOfChina(lng, lat)) return [lng, lat];
  let dLat = transformLat(lng - 105.0, lat - 35.0);
  let dLng = transformLng(lng - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * Math.PI;
  let magic = Math.sin(radLat);
  magic = 1 - GCJ_EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180.0) / (GCJ_A / sqrtMagic * Math.cos(radLat) * Math.PI);
  return [lng + dLng, lat + dLat];
}

  const savedVisitorId=localStorage.getItem(visitorIdKey);
  if(savedVisitorId&&/^[0-9a-f-]{36}$/i.test(savedVisitorId)) visitorId=savedVisitorId;
  else localStorage.setItem(visitorIdKey,visitorId);
}catch(error){
  console.warn("Visitor identity could not be saved on this device",error);
}

async function apiRequest(path,options={}){
  const response=await fetch(path,{...options,headers:{"Content-Type":"application/json","X-Visitor-Id":visitorId,...(options.headers||{})}});
  const body=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(body.detail||"服务暂不可用，请稍后重试");
  return body;
}

/* ===================== 本地降级存储（无后端时）=====================
   页面通过 CDN 分享时可能没有配套后端，此时把用户新增的地点、点评与
   投票保存在本机浏览器，功能保持完整；检测到后端可用时自动切回共享模式。 */
const localStoreKey="canguan-local-store-v1";
const localStore={
  read(){
    try{
      const raw=localStorage.getItem(localStoreKey);
      if(!raw) return {places:[],reviews:{},votes:{}};
      const data=JSON.parse(raw);
      const reviews=data.reviews&&typeof data.reviews==="object"?data.reviews:{};
      Object.values(reviews).forEach(list=>{
        if(Array.isArray(list)) list.forEach(review=>{if(!Array.isArray(review.replies)) review.replies=[];});
      });
      return {places:Array.isArray(data.places)?data.places:[],reviews,votes:data.votes||{}};
    }catch(error){ return {places:[],reviews:{},votes:{}}; }
  },
  write(data){
    try{ localStorage.setItem(localStoreKey,JSON.stringify(data)); return true; }
    catch(error){ console.warn("Local storage unavailable",error); return false; }
  }
};
let serviceMode="local";           // "local" | "shared"
let localData=localStore.read();
let lastBackendProbeAt=0;          // 上次探测后端的时间，用于低频重试

function localReviewsFor(poiId){
  const list=localData.reviews[String(poiId)]||[];
  return list.map(r=>({...r,ageDays:Math.max(0,Math.floor((Date.now()-new Date(r.createdAt).getTime())/86400000))}));
}
function localUsefulCount(reviewId){
  const votes=localData.votes[String(reviewId)]||{};
  return Object.keys(votes).filter(k=>votes[k]).length;
}
function localUsefulOn(reviewId){
  return Boolean((localData.votes[String(reviewId)]||{})[visitorId]);
}
function mergeLocalIntoPois(){
  POIS.forEach(p=>{
    const local=localReviewsFor(p.id);
    const shared=p.reviews||[];
    const seen=new Set(shared.map(r=>String(r.id)));
    const merged=shared.concat(local.filter(r=>!seen.has(String(r.id))));
    merged.forEach(r=>{
      r.useful=localUsefulCount(r.id);
      r.usefulOn=localUsefulOn(r.id);
    });
    p.reviews=merged;
    updateAgg(p);
  });
}
function setServiceStatus(text,connected){
  const status=document.getElementById("serviceStatus");
  if(!status) return;
  const label=status.querySelector(".txt");
  if(label) label.textContent=text; else status.textContent=text;
  status.classList.toggle("connected",Boolean(connected));
}

async function loadSharedData(){
  lastBackendProbeAt=Date.now();
  try{
    const data=await apiRequest("/api/guide/places");
    const sharedPlaces=Array.isArray(data.places)?data.places:[];
    POIS=POIS.filter(p=>!p.userAdded).concat(sharedPlaces);
    const allReviews=data.reviews||{};
    POIS.forEach(p=>{
      if(allReviews[String(p.id)]) p.reviews=allReviews[String(p.id)];
      updateAgg(p);
    });
    if(serviceMode!=="shared"){
      serviceMode="shared";
      mergeLocalIntoPois();
    }
    updateCategoryCounts();
    renderList(); renderMarkers();
    if(currentDetailPoi&&document.getElementById("detailOverlay").classList.contains("show")){
      currentDetailPoi=POIS.find(p=>String(p.id)===String(currentDetailPoi.id))||currentDetailPoi;
      renderDetail();
    }
    setServiceStatus("共享服务已连接",true);
    return true;
  }catch(error){
    console.warn("Shared guide service unavailable, falling back to local mode",error);
    serviceMode="local";
    POIS=POIS.filter(p=>!p.userAdded).concat(localData.places||[]);
    mergeLocalIntoPois();
    updateCategoryCounts();
    renderList(); renderMarkers();
    if(currentDetailPoi&&document.getElementById("detailOverlay").classList.contains("show")){
      currentDetailPoi=POIS.find(p=>String(p.id)===String(currentDetailPoi.id))||currentDetailPoi;
      renderDetail();
    }
    setServiceStatus("本机存储模式",false);
    return false;
  }
}

/* ===================== 数据构建 ===================== */
function build(){
  POIS = RAW_POI.map(p=>{
    const reviews = [];
    const [lng, lat] = wgs84ToGcj02(p.lng, p.lat);
    return {...p, lng, lat, reviews,
      videoUrl: "https://www.bilibili.com/search?keyword=" + encodeURIComponent(p.name + " 探店 罐罐")};
  });
  POIS.forEach(updateAgg);
}
function updateAgg(p){
  const rated = p.reviews.filter(r=>r.overall>0);
  const sum = rated.reduce((s,r)=>s+r.overall,0);
  p.ratingAvg = rated.length ? Math.round(sum/rated.length*10)/10 : null;
  const dist=[0,0,0,0,0];
  rated.forEach(r=>{ dist[5-r.overall]++; });
  p.dist = dist;
}

function updateCategoryCounts(){
  document.getElementById("cntFood").textContent=POIS.filter(p=>p.type==="food").length;
  document.getElementById("cntScene").textContent=POIS.filter(p=>p.type==="attraction").length;
}

        </div>

          p.ratingAvg ? `<span class="s">${p.ratingAvg.toFixed(1)}</span><span class="st">${p.reviews.length} 评</span>`

        }</div>
      </div>`;
    }).join("");

/* ===================== 地图 ===================== */
function initMap(){
  map = L.map("map",{center:[35.8,104.2], zoom:4, minZoom:3, maxZoom:18, zoomControl:true, tap:true});
  L.tileLayer("https://rt{s}.map.gtimg.com/tile?styleid=1&x={x}&y={y}&z={z}",{
    maxZoom:18, minZoom:3, subdomains:["0","1","2","3"],

  }).addTo(map);
  map.setMaxBounds([[12,72],[54,136]]);
  const updateLabelVisibility=()=>map.getContainer().classList.toggle("labels-hidden",map.getZoom()<=6);
  map.on("zoomend",updateLabelVisibility);
  updateLabelVisibility();
  renderMarkers();
}
function pinIcon(p){
  return L.divIcon({className:"poi-div", html:`<div class="poi-pin ${p.type}"><span class="ig">${p.type==="food"?"食":"景"}</span><span class="pin-name">${esc(p.name)}</span></div>`});
}
function renderMarkers(){
  if(!map) return;
  Object.values(markerByPoi).forEach(m=>map.removeLayer(m));
  markerByPoi = {};
  POIS.filter(p=>p.type===curType).forEach(p=>{
    const m = L.marker([p.lat,p.lng],{icon:pinIcon(p)}).addTo(map);
    m.bindPopup(popupHTML(p));
    m.on("click",()=>{ selectedPoiId=p.id; renderList(); });
    markerByPoi[p.id]=m;
  });
}
function popupHTML(p){
  const r = p.ratingAvg
    ? `${p.ratingAvg.toFixed(1)}<span style="font-size:11px;color:#8C8170">分 · ${p.reviews.length}条点评</span>`
    : "暂无评分";
  return `<div>
    <span class="det-badge ${p.type}">${p.type==="food"?"美食":"景点"}</span>
    <div class="pop-title">${esc(p.name)}</div>
    <div class="pop-row">综合评分 <span class="star">${r}</span> · ${esc(p.city)}</div>
    <div class="pop-desc">${esc(p.desc)}</div>
    <div class="pop-actions">
      <button class="pop-btn ${p.type}" onclick='openDetail(${JSON.stringify(String(p.id))})'>查看详情 · 点评</button>
      <a class="pop-btn video" href="${esc(p.videoUrl)}" target="_blank" rel="noopener">▶ 视频</a>
    </div>
  </div>`;
}
function selectPoi(id, fly){
  const p = POIS.find(x=>String(x.id)===String(id)); if(!p) return;
  selectedPoiId = p.id;
  if(!openCities.has(p.city)) openCities.add(p.city);

function closeDetail(){ document.getElementById("detailOverlay").classList.remove("show"); }

function detailHTML(p){
  const ratingBlock = p.ratingAvg
    ? `<div class="det-num">${p.ratingAvg.toFixed(1)}</div>`
    : `<div class="det-num" style="color:var(--muted);font-size:24px">暂无</div>`;

    const wd = p.reviews.filter(r=>r.dims[i]>0);

  }).join("");

  return `

    <span class="det-badge ${p.type}">${p.type==="food"?"美食":"景点"}</span>
    <div class="det-name">${esc(p.name)}</div>
    <div class="det-city">${esc(p.city)} · 运营录入 · ${p.reviews.length} 条点评</div>
  </div>
  <div class="det-score">
    ${ratingBlock}
    <div>
      <div class="det-stars">${p.ratingAvg ? starStr(Math.round(p.ratingAvg)) : "☆☆☆☆☆"}</div>
      <div class="det-reviews">${p.ratingAvg ? "综合评分 " + p.ratingAvg.toFixed(1) : "还没有点评，来抢首评"}</div>
    </div>
  </div>
  ${dims}
  <div class="det-desc">${esc(p.desc)}</div>
  <a class="det-video" href="${esc(p.videoUrl)}" target="_blank" rel="noopener">▶ 观看探店视频</a>
  <div class="h-sec"><h3>评分分布</h3><button class="btn-main ${p.type}" onclick='openReview(${JSON.stringify(String(p.id))})' style="width:auto;padding:8px 18px">发表点评</button></div>
  ${distHTML(p)}
  <div class="h-sec"><h3>用户点评</h3><div class="filter-row">${filterHTML()}</div></div>
  <div id="rvList">${reviewsHTML(p)}</div>`;
}
function distHTML(p){
  const total=p.reviews.length;
  if(!total) return '<div class="empty" style="padding:14px">暂无评分数据</div>';
  const labels=["很好","好","一般","差","很差"];
  return p.dist.map((cnt,i)=>{
    const pct=Math.round(cnt/total*100);
    return `<div class="dist"><span class="lbl">${labels[i]}</span><div class="bar"><div class="fill" style="width:${pct}%"></div></div><span class="pct">${pct}%</span></div>`;
  }).join("");
}
function filterHTML(){
  const b=(k,lbl)=>`<button class="${detailFilter===k?"on "+curType:""}" onclick="setFilter('${k}')">${lbl}</button>`;
  return `${b("latest","最新")}${b("good","好评")}${b("bad","差评")}`;
}
function setFilter(f){ detailFilter=f; renderDetail(); }
function reviewsHTML(p){
  let list=[...p.reviews];
  if(detailFilter==="good") list=list.filter(r=>r.overall>=4);
  if(detailFilter==="bad") list=list.filter(r=>r.overall<=2);
  list.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  if(!list.length) return '<div class="empty">该筛选下暂无点评</div>';
  const fresh=list.filter(r=>r.ageDays<=90);
  const old=list.filter(r=>r.ageDays>90);
  let oldHTML="";
  if(old.length){
    oldHTML = `<div class="rv-old"><button onclick="toggleOld(this)">展开 ${old.length} 条更早的点评</button></div>
      <div id="oldRv" style="display:none">${old.map(r=>rvHTML(p,r)).join("")}</div>`;
  }
  return fresh.map(r=>rvHTML(p,r)).join("") + oldHTML;
}
function toggleOld(btn){
  const box=document.getElementById("oldRv");
  const show=box.style.display==="none";
  box.style.display=show?"block":"none";
  btn.textContent=show?"收起更早点评":"展开更早的点评";
}
function rvHTML(p,r){
  const name = r.anonymous ? "匿名用户" : (r.author||"匿名用户");
  const replies = Array.isArray(r.replies) ? r.replies : [];
  const dims = r.dims.some(d=>d>0) ? DIMS[p.type].map((lb,i)=>`${lb} ${r.dims[i]||"--"}`).join(" · ") : "";
  const stars = r.overall>0 ? `<span class="rv-stars">${starStr(r.overall)}</span>` : '<span class="rv-stars" style="color:var(--muted);letter-spacing:0">未评分</span>';
  const tags = (r.tags||[]).map(t=>`<span class="${p.type}">${esc(t)}</span>`).join("");
  const repliesHTML = replies.length
    ? `<div class="rv-replies">${replies.map(reply=>`<div class="rv-reply-item">
        <div class="rv-reply-top"><span class="rv-reply-author">${esc(reply.author||"用户")}</span><span class="rv-reply-time">${ageText(reply.ageDays||0)}</span></div>
        <div class="rv-reply-content">${esc(reply.content)}</div>
      </div>`).join("")}</div>`
    : "";
  return `<div class="rv">
    <div class="rv-top">
      <span class="rv-author">${esc(name)}</span>${r.anonymous?'<span class="rv-anon">（匿名）</span>':""}
      ${stars}
      <span class="rv-time">${ageText(r.ageDays)}</span>
    </div>
    ${dims?`<div class="rv-dims">${dims}</div>`:""}
    <div class="rv-content">${esc(r.content)}</div>
    ${tags?`<div class="rv-tags">${tags}</div>`:""}
    <div class="rv-foot">
      <button class="rv-useful ${r.usefulOn?"on":""}" onclick='likeReview(${JSON.stringify(String(p.id))},${JSON.stringify(String(r.id))},this)'>有用 · ${r.useful}</button>
      <button class="rv-reply" onclick='toggleReplyForm(${JSON.stringify(String(r.id))})'>回复 · ${replies.length}</button>
    </div>
    ${repliesHTML}
    <div class="rv-reply-form" id="replyForm-${esc(r.id)}" hidden>
      <textarea maxlength="500" placeholder="回复这条点评…"></textarea>
      <div class="rv-reply-actions">
        <button type="button" onclick='toggleReplyForm(${JSON.stringify(String(r.id))})'>取消</button>
        <button type="button" class="submit" onclick='submitReviewReply(${JSON.stringify(String(p.id))},${JSON.stringify(String(r.id))},this)'>发送回复</button>
      </div>
    </div>
  </div>`;
}
function toggleReplyForm(reviewId){
  const form=document.getElementById("replyForm-"+reviewId);
  if(!form) return;
  form.hidden=!form.hidden;
  if(!form.hidden) form.querySelector("textarea").focus();
}
async function submitReviewReply(poiId,reviewId,button){
  const p=POIS.find(item=>String(item.id)===String(poiId));
  const review=p&&p.reviews.find(item=>String(item.id)===String(reviewId));
  const form=document.getElementById("replyForm-"+reviewId);
  const textarea=form&&form.querySelector("textarea");
  const content=textarea?textarea.value.trim():"";
  if(!review||!textarea) return;
  if(!content){toast("请输入回复内容");textarea.focus();return;}
  if(content.length>500){toast("回复最多 500 个字符");return;}
  button.disabled=true;
  try{
    if(serviceMode==="local"){
      if(!Array.isArray(review.replies)) review.replies=[];
      review.replies.push({
        id:"local-reply-"+Date.now()+"-"+Math.floor(Math.random()*1e6),
        author:userNickname,
        content,
        createdAt:new Date().toISOString(),
        ageDays:0
      });
      if(String(review.id).startsWith("local-")) localStore.write(localData);
    }else{
      await apiRequest(`/api/guide/reviews/${encodeURIComponent(review.id)}/replies`,{
        method:"POST",
        body:JSON.stringify({author:userNickname,content})
      });
      await loadSharedData();
    }
    renderDetail();
    toast("回复已发布");
  }catch(error){
    toast(error.message);
    button.disabled=false;
  }
}
async function likeReview(poiId,rvId,btn){
  const p=POIS.find(x=>String(x.id)===String(poiId)), r=p&&p.reviews.find(x=>String(x.id)===String(rvId));
  if(!r) return;
  if(serviceMode==="local"){
    const votes=localData.votes[String(r.id)]||{};
    votes[visitorId]=!votes[visitorId];
    localData.votes[String(r.id)]=votes;
    localStore.write(localData);
    r.useful=localUsefulCount(r.id);
    r.usefulOn=localUsefulOn(r.id);
    btn.classList.toggle("on",r.usefulOn);
    btn.textContent="有用 · "+r.useful;
    return;
  }
  try{
    const result=await apiRequest(`/api/guide/reviews/${encodeURIComponent(r.id)}/vote`,{method:"POST"});
    r.useful=result.useful; r.usefulOn=result.usefulOn;
    btn.classList.toggle("on",r.usefulOn);
    btn.textContent="有用 · "+r.useful;
  }catch(error){toast(error.message);}
}

  </div>
  <div class="f-field"><label>文字点评（选填）</label>
    <textarea id="rvContent" maxlength="500" placeholder="写下你的真实体验（选填）" oninput="onContent(this)"></textarea>
    <div class="f-count" id="rvCount">0 / 500</div>
  </div>
  <div class="f-field"><label>推荐标签（选填）</label><div class="tags-row">${tags}</div></div>
  <label class="anon-row"><input type="checkbox" id="rvAnon" onchange="onAnon(this)"> 匿名点评（不展示昵称）</label>

function setOverall(n){
  state.overall=n;
  document.querySelectorAll("#ovStars .st").forEach(sp=>sp.classList.toggle("on", +sp.dataset.v<=n));
}
function setDim(i,n){
  state.dims[i]=n;
  document.querySelectorAll("#reviewBody .dims-input .st").forEach(sp=>{
    if(+sp.dataset.d===i) sp.classList.toggle("on", +sp.dataset.v<=n);
  });
}
function onContent(el){
  state.content=el.value;
  document.getElementById("rvCount").textContent = el.value.length+" / 500";
}
function onAnon(el){ state.anonymous=el.checked; }
function toggleTag(t,btn){
  const i=state.tags.indexOf(t);
  if(i>=0){ state.tags.splice(i,1); btn.classList.remove("on"); }
  else{ state.tags.push(t); btn.classList.add("on"); }
}
async function submitReview(){
  const p=currentDetailPoi;
  const c=state.content.trim();
  const hasOverall = state.overall>0;
  const hasDim = state.dims.some(d=>d>0);
  const hasText = c.length>0;
  if(!hasOverall && !hasDim && !hasText){ toast("请至少填写星级、维度评分或文字点评"); return; }
  if(serviceMode==="local"){
    const reviewId="local-"+Date.now()+"-"+Math.floor(Math.random()*1e6);
    const record={
      id:reviewId, overall:state.overall, dims:state.dims.slice(), content:c,
      tags:state.tags.slice(), anonymous:state.anonymous, author:userNickname,
      createdAt:new Date().toISOString(), useful:0, usefulOn:false
    };
    const key=String(p.id);
    localData.reviews[key]=localData.reviews[key]||[];
    localData.reviews[key].unshift(record);
    localStore.write(localData);
    closeReview();
    await loadSharedData();
    toast("点评已保存在本机");
    return;
  }
  try{
    await apiRequest("/api/guide/reviews",{method:"POST",body:JSON.stringify({
      poi_id:String(p.id),overall:state.overall,dimensions:state.dims,content:c,
      tags:state.tags,anonymous:state.anonymous,author:userNickname
    })});
    closeReview();
    await loadSharedData();
    closeReview();
    toast("点评已发布并共享");
  }catch(error){toast(error.message);}
}

/* ===================== UGC 补充 ===================== */
function openUGC(){
  document.getElementById("ugcBody").innerHTML = ugcFormHTML();
  document.getElementById("ugcOverlay").classList.add("show");
}
function closeUGC(){ picking=false; document.getElementById("ugcOverlay").classList.remove("show"); }
function ugcFormHTML(){
  return `
  <div class="grid-3">
    <div class="f-field"><label>城市 <span class="req">*</span></label><input type="text" id="ugc-city" placeholder="如：成都"></div>
    <div class="f-field"><label>类型 <span class="req">*</span></label>
      <select id="ugc-type"><option value="food">美食</option><option value="attraction">景点</option></select></div>
    <div class="f-field"><label>名称 <span class="req">*</span></label><input type="text" id="ugc-name" placeholder="目的地名称"></div>
  </div>
  <div class="grid-2">
    <div class="f-field"><label>经度 lng <span class="req">*</span></label><input type="number" id="ugc-lng" step="0.00001" placeholder="如 114.06000"></div>
    <div class="f-field"><label>纬度 lat <span class="req">*</span></label><input type="number" id="ugc-lat" step="0.00001" placeholder="如 22.54000"></div>
  </div>
  <button type="button" class="pick-map" onclick="pickCoord()">在地图上选点，自动填入坐标</button>
  <div class="f-field"><label>推荐理由 <span class="req">*</span></label><textarea id="ugc-desc" maxlength="300" placeholder="为什么推荐这里？"></textarea></div>
  <div class="f-field"><label>关联视频链接（选填）</label><input type="text" id="ugc-video" placeholder="B站视频链接"></div>
  <div style="margin-top:20px"><button class="btn-main" onclick="submitUGC()">提交推荐</button></div>
  <div class="f-hint">提交后会立即加入共享地图，所有访客都能看到。</div>`;
}
function pickCoord(){
  document.getElementById("ugcOverlay").classList.remove("show");
  picking=true; hint("点击地图选择坐标…");
  map.once("click", e=>{
    picking=false;
    document.getElementById("ugc-lng").value=e.latlng.lng.toFixed(5);
    document.getElementById("ugc-lat").value=e.latlng.lat.toFixed(5);
    if(tempMarker) map.removeLayer(tempMarker);
    tempMarker=L.marker(e.latlng).addTo(map);
    document.getElementById("ugcOverlay").classList.add("show");
    toast("坐标已填入，可继续填写");
  });
}
async function submitUGC(){
  const city=document.getElementById("ugc-city").value.trim();
  const type=document.getElementById("ugc-type").value;
  const name=document.getElementById("ugc-name").value.trim();
  const lng=parseFloat(document.getElementById("ugc-lng").value);
  const lat=parseFloat(document.getElementById("ugc-lat").value);
  const desc=document.getElementById("ugc-desc").value.trim();
  const video=document.getElementById("ugc-video").value.trim();
  if(!city){ toast("请填写城市"); return; }
  if(!name){ toast("请填写名称"); return; }
  if(!["food","attraction"].includes(type)){ toast("请选择有效的地点类型"); return; }
  if(!Number.isFinite(lng)||!Number.isFinite(lat)||lng<73||lng>135||lat<17||lat>54){ toast("请填写中国范围内有效的经纬度"); return; }
  if(!desc){ toast("请填写推荐理由"); return; }
  let videoUrl="https://www.bilibili.com/search?keyword="+encodeURIComponent(name+" 探店 罐罐");
  if(video){
    try{
      const url=new URL(video);
      if(url.protocol!=="https:"&&url.protocol!=="http:") throw new Error("Unsupported URL protocol");
      videoUrl=url.href;
    }catch{ toast("视频链接需使用有效的 http 或 https 地址"); return; }
  }
  const payload={category:type,city,name,lng,lat,description:desc,video_url:videoUrl};
  if(serviceMode==="local"){
    const localId="local-poi-"+Date.now()+"-"+Math.floor(Math.random()*1e6);
    const record={
      id:localId,type,city,name,lng,lat,desc,videoUrl,userAdded:true
    };
    localData.places=localData.places||[];
    localData.places.unshift(record);
    localStore.write(localData);
    await loadSharedData();
    closeUGC();
    setType(type);
    selectPoi(localId,true);
    toast("地点已保存在本机");
    return;
  }
  try{
    const result=await apiRequest("/api/guide/places",{method:"POST",body:JSON.stringify(payload)});
    await loadSharedData();
    closeUGC();
    setType(type);
    selectPoi(result.id,true);
    toast("地点已发布并共享");
  }catch(error){toast(error.message);}
}

/* ===================== toast ===================== */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ===================== 分享与安装 ===================== */
let deferredInstallPrompt=null;
function dismissInstall(){
  const hint=document.getElementById("installHint");
  if(hint) hint.classList.remove("show");
  try{ localStorage.setItem("canguan-install-dismissed","1"); }catch(error){}
}
function maybeShowInstallHint(){
  if(deferredInstallPrompt) return;
  let dismissed=false;
  try{ dismissed=localStorage.getItem("canguan-install-dismissed")==="1"; }catch(error){}
  if(dismissed) return;
  const isStandalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
  if(isStandalone) return;
  const hint=document.getElementById("installHint");
  if(hint) hint.classList.add("show");
}
window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  maybeShowInstallHint();
});
window.addEventListener("appinstalled",()=>{ dismissInstall(); deferredInstallPrompt=null; });

/* ===================== 分享面板 =====================
   手机与电脑共用同一个链接：电脑扫码即可在手机打开，手机可直接调起系统分享。 */
function buildQR(text){
  try{
    const qr=qrcode(0,"M");
    qr.addData(text);
    qr.make();
    const count=qr.getModuleCount();
    const cell=6, quiet=4;
    const size=(count+quiet*2)*cell;
    let path="";
    for(let row=0;row<count;row++){
      for(let col=0;col<count;col++){
        if(qr.isDark(row,col)) path+=`M${(col+quiet)*cell},${(row+quiet)*cell}h${cell}v${cell}h-${cell}z`;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="指南链接二维码"><rect width="${size}" height="${size}" fill="#fff"/><path d="${path}" fill="#26211A"/></svg>`;
  }catch(error){
    console.warn("QR generation failed",error);
    return "";
  }
}
function shareSheetHTML(){
  const url=location.href;
  const isPhone=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const qr=buildQR(url);
  const note=isPhone
    ? "把链接发给朋友，或用<b>系统分享</b>直接发送到微信、QQ等应用。"
    : "手机<b>扫一扫</b>下方二维码，即可在手机浏览器中打开这份指南。";
  return `
  <div style="text-align:center">
    ${qr?`<div class="qr-box">${qr}</div>`:""}
    <div class="share-url">
      <span class="txt">${esc(url)}</span>
      <button class="btn-plain" style="padding:7px 12px;font-size:12.5px" onclick="copyShareLink()">复制</button>
    </div>
    <div class="share-act">
      <button class="btn-main" onclick="nativeShare()">系统分享</button>
      <button class="btn-plain" onclick="copyShareLink()">复制链接</button>
    </div>
    <div class="share-note">${note}</div>
  </div>`;
}
function openShare(){
  document.getElementById("shareBody").innerHTML=shareSheetHTML();
  document.getElementById("shareOverlay").classList.add("show");
}
function closeShare(){ document.getElementById("shareOverlay").classList.remove("show"); }
async function copyShareLink(){
  const url=location.href;
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(url); toast("链接已复制，可发给朋友"); return; }
  }catch(error){}
  try{
    const box=document.createElement("textarea");
    box.value=url; box.style.position="fixed"; box.style.opacity="0";
    document.body.appendChild(box); box.select();
    document.execCommand("copy");
    document.body.removeChild(box);
    toast("链接已复制，可发给朋友");
  }catch(error){ toast("复制失败，请长按上方链接手动复制"); }
}
async function nativeShare(){
  const payload={
    title:"罐罐旅游指南 · 全国美食与景点地图",
    text:"全国美食与景点地图，手机和电脑都能打开",
    url:location.href
  };
  if(!navigator.share){ copyShareLink(); return; }
  try{
    await navigator.share(payload);
  }catch(error){
    if(error && error.name==="AbortError") return;
    copyShareLink();
  }
}

/* ===================== 启动 ===================== */
build();
updateCategoryCounts();
initMap();
renderList();
loadSharedData();
/* 仅在共享服务可用时持续轮询。本机存储模式下后端必然不可达，继续请求只是
   白白消耗手机流量与电量，因此改为每 2 分钟静默重试一次，兼顾"后端后来上线"。 */
setInterval(()=>{
  if(serviceMode==="shared") loadSharedData();
  else if(Date.now()-lastBackendProbeAt>120000) loadSharedData();
},30000);
document.getElementById("shareBtn").addEventListener("click",openShare);
document.getElementById("installBtn").addEventListener("click",async()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{ await deferredInstallPrompt.userChoice; }catch(error){}
    deferredInstallPrompt=null;
    dismissInstall();
  }else{
    const hint=document.getElementById("installHint");
    if(hint) hint.querySelector(".txt").innerHTML="<b>手动添加到主屏幕</b><br>点击浏览器右上角菜单，选择「添加到主屏幕」";
  }
});
if(document.getElementById("installHint")){
  document.getElementById("installHint").addEventListener("click",event=>{
    if(event.target.closest(".x")) dismissInstall();
  });
}
setTimeout(maybeShowInstallHint,2500);

/* 注册 Service Worker，支持添加到主屏幕与离线打开 */
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(error=>console.warn("Service worker registration failed",error));
  });
}
